<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Pearls</title>

<link rel="stylesheet" href="style.css">

<style>
.search-box{
    width:90%;
    max-width:500px;
    display:block;
    margin:20px auto;
    padding:14px;
    font-size:16px;
    border-radius:12px;
    border:2px solid #7b2cbf;
    outline:none;
}

.info{
    text-align:center;
    color:#666;
    margin-top:30px;
}
</style>

</head>

<body>

<h2 style="text-align:center;">🔍 Search Pearls</h2>

<input
type="text"
class="search-box"
placeholder="Search pearls...">

<p class="info">
Search feature coming soon...
</p>




<script src="searchData.js"></script>

<script>

const input=document.querySelector(".search-box");
const info=document.querySelector(".info");

input.addEventListener("keyup",function(){

let value=this.value.toLowerCase().trim();

if(value===""){

info.innerHTML="Search feature ready...";

return;

}

let results=searchData.filter(function(item){

return item.title.toLowerCase().includes(value);

});

if(results.length===0){

info.innerHTML="<p>No pearls found.</p>";

return;

}

let html="";

results.forEach(function(item){

html+=`
<div
style="
background:white;
padding:14px;
margin:12px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
cursor:pointer;"
onclick="location.href='${item.page}'">

${item.title}

</div>
`;

});

info.innerHTML=html;

});


</script>
</body>
</html>
