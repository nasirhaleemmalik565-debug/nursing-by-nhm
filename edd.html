<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDD Calculator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="appbar">

<a href="tools.html" class="back-btn">←</a>

<div class="appbar-title">
EDD Calculator
</div>

</div>

<div class="container">

<div class="section-title">
EXPECTED DATE OF DELIVERY
</div>

<div class="pearl-card">

<label><b>Select LMP</b></label>

<input type="date" id="lmp">

<br><br>

<button onclick="calculateEDD()" class="btn">

Calculate

</button>

</div>

<div class="pearl-card">

<h3>📅 Result</h3>

<div id="eddResult">

Select Last Menstrual Period.

</div>

</div>

</div>

<script>

function calculateEDD(){

let lmp =
new Date(document.getElementById("lmp").value);

if(isNaN(lmp)){

let today = new Date();

let diff =
today - lmp;

let totalDays =
Math.floor(diff / (1000*60*60*24));

let weeks =
Math.floor(totalDays / 7);

let days =
totalDays % 7;

let trimester = "";

if(weeks < 13){

trimester = "First Trimester";

}
else if(weeks < 28){

trimester = "Second Trimester";

}
else{

trimester = "Third Trimester";

}

let remainingDays =
280 - totalDays;

let remainingWeeks =
Math.floor(remainingDays / 7);

let remainingExtraDays =
remainingDays % 7;

let options = {

weekday:"long",

day:"numeric",

month:"long",

year:"numeric"

};

document.getElementById("eddResult").innerHTML =

"<div style='font-size:15px;color:#666;'>🤰 Expected Date of Delivery</div>"

+

"<div style='font-size:26px;font-weight:bold;color:#6A1B9A;margin:10px 0;'>"

+edd.toLocaleDateString("en-IN",options)+

"</div>"

+

"<div style='background:#F7F7F7;padding:12px;border-radius:12px;text-align:left;line-height:1.8;'>"

+

"<b>🩺 Gestational Age</b><br>"

+weeks+" Weeks "+days+" Days"

+

"<br><br>"

+

"<b>🌸 Current Trimester</b><br>"

+trimester+

"<br><br>"

+

"<b>⏳ Time Remaining</b><br>"

+remainingWeeks+" Weeks "+remainingExtraDays+" Days"

+

"</div>"

+

"<br>"

+

"<div style='font-size:14px;color:#666;'>"

+"📅 Based on Naegele's Rule (LMP + 280 Days)"

+"</div>";



}

</script>

</body>

</html>
