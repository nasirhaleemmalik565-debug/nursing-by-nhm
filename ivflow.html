<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IV Flow Rate Calculator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="appbar">

<a href="tools.html" class="back-btn">←</a>

<div class="appbar-title">
IV Flow Rate
</div>

</div>

<div class="container">

<div class="section-title">
IV FLOW RATE CALCULATOR
</div>

<div class="pearl-card">

<label><b>Total Volume (mL)</b></label>

<input type="number" id="volume"
placeholder="Example: 500">

<br><br>

<label><b>Time (Hours)</b></label>

<input type="number" id="hours"
placeholder="Example: 8">

<br><br>

<label><b>Drop Factor (gtt/mL)</b></label>

<select id="dropFactor">

<option value="15">15</option>

<option value="20">20</option>

<option value="60">60 (Microdrip)</option>

</select>

<br><br>

<button class="btn"
onclick="calculateFlow()">

Calculate

</button>

</div>

<div class="pearl-card">

<h3>💧 Result</h3>

<div id="flowResult">

Enter values above.

</div>

</div>

<div class="footer-space"></div>

</div>

<script>

function calculateFlow(){

let volume =
parseFloat(document.getElementById("volume").value);

let hours =
parseFloat(document.getElementById("hours").value);

let factor =
parseFloat(document.getElementById("dropFactor").value);

if(!volume || !hours){

document.getElementById("flowResult").innerHTML=
"Please enter valid values.";

return;

}

let mlhr =
volume/hours;

let gttmin =
(volume*factor)/(hours*60);

document.getElementById("flowResult").innerHTML =

"<div style='font-size:15px;color:#666;'>"

+"💧 Infusion Rate"

+"</div>"

+

"<div style='font-size:40px;font-weight:bold;color:#6A1B9A;margin:10px 0;'>"

+mlhr.toFixed(1)+" mL/hr"

+"</div>"

+

"<div style='background:#F7F7F7;padding:12px;border-radius:12px;text-align:left;line-height:1.8;'>"

+

"<b>💉 Drops per Minute</b><br>"

+gttmin.toFixed(1)+" gtt/min"

+

"<br><br>"

+

"<b>🩸 Total Volume</b><br>"

+volume+" mL"

+

"<br><br>"

+

"<b>⏱️ Infusion Time</b><br>"

+hours+" Hours"

+

"<br><br>"

+

"<b>💧 Drop Factor</b><br>"

+factor+" gtt/mL"

+

"</div>"

+

"<br>"

+

"<div style='font-size:14px;color:#666;'>"

+"📋 Formula: (Volume × Drop Factor) ÷ Time (minutes)"

+"</div>";


}

</script>

</body>

</html>
