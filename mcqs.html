<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily MCQs | Nursing by NHM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F5F3FF;
}

header{
background:#6A1B9A;
color:white;
padding:18px;
display:flex;
align-items:center;
}

header a{
color:white;
text-decoration:none;
font-size:24px;
}

header h2{
margin:0 auto;
margin-right:24px;
font-size:24px;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:20px;
box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.progress{
width:100%;
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-bottom:15px;
}

#progressFill{
height:100%;
width:0%;
background:#6A1B9A;
transition:.4s;
}

#progressText{
font-weight:bold;
color:#6A1B9A;
margin-bottom:10px;
}

#timer{
text-align:right;
font-weight:bold;
color:#D32F2F;
margin-bottom:15px;
}
#quizDay{
text-align:center;
background:#EDE7F6;
color:#6A1B9A;
font-weight:bold;
padding:10px;
border-radius:10px;
margin-bottom:20px;
}

.question{
font-size:22px;
font-weight:bold;
line-height:1.5;
margin-bottom:20px;
}

.option{
padding:15px;
margin:12px 0;
background:#F3F3F3;
border-radius:12px;
border:2px solid transparent;
cursor:pointer;
transition:.3s;
}

.option:hover{
background:#ECECEC;
}

.selected{
background:#E9D5FF;
border-color:#6A1B9A;
color:#4A148C;
font-weight:bold;
}

.correct{
background:#D4EDDA;
border-color:#28A745;
color:#155724;
font-weight:bold;
}

.wrong{
background:#F8D7DA;
border-color:#DC3545;
color:#721C24;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#6A1B9A;
color:white;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

#result{
margin-top:18px;
text-align:center;
font-size:18px;
font-weight:bold;
}

.mcq-header{
position:relative;
}

.mcq-header h2{
position:absolute;
left:50%;
transform:translateX(-50%);
margin:0;
}

.mcq-header a{
z-index:1;
}

</style>

</head>

<body>


<header class="mcq-header">

<a href="index.html">←</a>

<h2>Daily MCQs</h2>

</header>

<div class="card">

<div id="progressText"></div>

<div class="progress">
<div id="progressFill"></div>
</div>

<div id="timer"></div>

<div id="quizDay"></div>

<div class="question" id="question"></div>
<div class="option"></div>
<div class="option"></div>
<div class="option"></div>
<div class="option"></div>

<button onclick="checkAnswer()">
Submit Answer
</button>

<p id="result"></p>

<button id="nextBtn" style="display:none;">
Next Question →
</button>

<script src="mcqs.js"></script>

</div>

</body>

</html>
