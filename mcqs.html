<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily MCQs | Nursing by NHM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F5F3FF;
}

header{
background:#6A1B9A;
color:#fff;
padding:18px;
display:flex;
align-items:center;
}

header a{
color:#fff;
text-decoration:none;
font-size:24px;
}

header h2{
margin:0 auto;
margin-right:24px;
}

.card{
background:#fff;
margin:20px;
padding:20px;
border-radius:20px;
box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.question{
font-size:22px;
font-weight:700;
line-height:1.5;
margin-bottom:20px;
}

.option{
padding:15px;
margin:12px 0;
background:#F3F3F3;
border-radius:12px;
border:2px solid transparent;
cursor:pointer;
transition:.3s;
}

.option:hover{
background:#ECECEC;
}

.selected{
background:#E9D5FF;
border-color:#6A1B9A;
color:#4A148C;
font-weight:bold;
}

.correct{
background:#D4EDDA;
border-color:#28A745;
color:#155724;
font-weight:bold;
}

.wrong{
background:#F8D7DA;
border-color:#DC3545;
color:#721C24;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#6A1B9A;
color:white;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

#result{
margin-top:18px;
text-align:center;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<a href="index.html">←</a>

<h2>Daily MCQs</h2>

</header>

<div class="card">

<div class="question" id="question">
Which vitamin deficiency causes Night Blindness?
</div>

<div class="option" data-correct="true">
A. Vitamin A
</div>

<div class="option">
B. Vitamin C
</div>

<div class="option">
C. Vitamin D
</div>

<div class="option">
D. Vitamin K
</div>

<button onclick="checkAnswer()">
Submit Answer
</button>

<p id="result"></p>

<button id="nextBtn" style="display:none;">
Next Question →
</button>

<script>

let questions=[

{
question:"Which vitamin deficiency causes Night Blindness?",
options:[
"A. Vitamin A",
"B. Vitamin C",
"C. Vitamin D",
"D. Vitamin K"
],
correct:0
},

{
question:"Normal adult respiratory rate is:",
options:[
"A. 8–12/min",
"B. 12–20/min",
"C. 20–28/min",
"D. 24–30/min"
],
correct:1
},

{
question:"Which chamber of the heart has the thickest wall?",
options:[
"A. Right Atrium",
"B. Left Atrium",
"C. Right Ventricle",
"D. Left Ventricle"
],
correct:3
},

{
question:"The antidote for Heparin is:",
options:[
"A. Vitamin K",
"B. Protamine Sulfate",
"C. Atropine",
"D. Naloxone"
],
correct:1
},

{
question:"Normal blood pH is:",
options:[
"A. 7.15–7.25",
"B. 7.25–7.35",
"C. 7.35–7.45",
"D. 7.45–7.55"
],
correct:2
},
{
question:"Drug of choice for Anaphylaxis is:",
options:[
"A. Hydrocortisone",
"B. Atropine",
"C. Adrenaline",
"D. Dopamine"
],
correct:2
},

{
question:"Normal adult pulse rate is:",
options:[
"A. 40–60/min",
"B. 60–100/min",
"C. 100–120/min",
"D. 120–140/min"
],
correct:1
},

{
question:"The universal donor blood group is:",
options:[
"A. A+",
"B. B+",
"C. AB+",
"D. O Negative"
],
correct:3
},

{
question:"The first heart sound (S1) is produced by closure of:",
options:[
"A. Aortic & Pulmonary valves",
"B. Mitral & Tricuspid valves",
"C. Aortic valve only",
"D. Pulmonary valve only"
],
correct:1
},

{
question:"Which vitamin deficiency causes Scurvy?",
options:[
"A. Vitamin A",
"B. Vitamin C",
"C. Vitamin D",
"D. Vitamin K"
],
correct:1
}

];

let current=0;
let selected=null;
let score=0;
let answered=false;

const question=document.getElementById("question");

const options=document.querySelectorAll(".option");

const result=document.getElementById("result");

const nextBtn=document.getElementById("nextBtn");

function loadQuestion(){

answered=false;

selected=null;

result.innerHTML="";

nextBtn.style.display="none";

question.innerHTML=questions[current].question;

options.forEach(function(option,index){

option.innerHTML=questions[current].options[index];

option.classList.remove("selected","correct","wrong");

option.removeAttribute("data-correct");

if(index==questions[current].correct){

option.dataset.correct="true";

}

});

}

options.forEach(function(option){

option.onclick=function(){

options.forEach(function(o){

o.classList.remove("selected");

});

selected=this;

this.classList.add("selected");

};

});

function checkAnswer(){

if(selected==null){

alert("Please select an answer.");
return;

}

if(answered){
return;
}

answered=true;

if(selected.dataset.correct=="true"){

selected.classList.add("correct");

result.innerHTML="✅ Correct!";

result.style.color="green";

score++;

}

else{

selected.classList.add("wrong");

document.querySelector("[data-correct='true']").classList.add("correct");

result.innerHTML="❌ Incorrect!";

result.style.color="red";

}

nextBtn.style.display="block";

}

nextBtn.onclick=function(){

current++;

if(current<questions.length){

loadQuestion();

}

else{

document.querySelector(".card").innerHTML=`

<h2 style="text-align:center;color:#6A1B9A;">
🎉 Quiz Completed
</h2>

<p style="text-align:center;font-size:22px;font-weight:bold;">
Your Score
</p>

<h1 style="text-align:center;color:#6A1B9A;">
${score} / ${questions.length}
</h1>

<button onclick="location.reload()">
Restart Quiz
</button>

`;

}

};

loadQuestion();

</script>

</div>

</body>

</html>
