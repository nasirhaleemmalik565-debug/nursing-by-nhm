
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily MCQs | Nursing by NHM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F5F3FF;
}

header{
background:#6A1B9A;
color:white;
padding:14px;
display:flex;
align-items:center;
}

header a{
color:white;
text-decoration:none;
font-size:24px;
}

header h2{
font-size:20px;
}

.card{
background:white;
margin:16px;
padding:18px;
border-radius:20px;
box-shadow:0 3px 12px rgba(0,0,0,.12);

display:flex;
flex-direction:column;
height:calc(100vh - 120px);
}
.progress{
width:100%;
height:9px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-bottom:12px;
}

#progressFill{
height:100%;
width:0%;
background:#6A1B9A;
transition:.4s;
}

#progressText{
font-weight:bold;
color:#6A1B9A;
margin-bottom:8px;
font-size:22px;
}

#timer{
margin-bottom:10px;
}

#quizDay{
padding:9px;
margin-bottom:16px;
}

.question{
font-size:20px;
font-weight:bold;
line-height:1.35;
margin-bottom:14px;
}

.option{
padding:14px;
margin:10px 0;
}

.option:hover{
background:#ECECEC;
}

.selected{
background:#E9D5FF;
border-color:#6A1B9A;
color:#4A148C;
font-weight:bold;
}

.correct{
background:#D4EDDA;
border-color:#28A745;
color:#155724;
font-weight:bold;
}

.wrong{
background:#F8D7DA;
border-color:#DC3545;
color:#721C24;
font-weight:bold;
}

button{
padding:14px;
margin-top:16px;
font-size:18px;
}

#result{
margin-top:18px;
text-align:center;
font-size:18px;
font-weight:bold;
}

.mcq-header{
position:relative;
}

.mcq-header h2{
position:absolute;
left:50%;
transform:translateX(-50%);
margin:0;
}

.mcq-header a{
z-index:1;
}

.quiz-content{
flex:1;
overflow-y:auto;
display:flex;
flex-direction:column;
}

.button-area{
background:white;
padding-top:10px;
}

.button-area button{
width:100%;
margin-top:10px;
}

</style>

</head>

<body>


<header class="mcq-header">

<a href="index.html">←</a>

<h2>Daily MCQs</h2>

</header>

<div class="card">
<div class="quiz-content">

<div id="progressText"></div>

<div class="progress">
<div id="progressFill"></div>
</div>

<div id="timer"></div>

<div id="quizDay"></div>

<div class="question" id="question"></div>
<div class="option"></div>
<div class="option"></div>
<div class="option"></div>
<div class="option"></div>

<button onclick="checkAnswer()">
Submit Answer
</button>

<p id="result"></p>

</div>

<div class="button-area">

<button onclick="checkAnswer()">
Submit Answer
</button>

<button id="nextBtn" style="display:none;">
Next Question →
</button>

</div>
<script src="questions.js"></script>
<script src="mcqs.js"></script>

</div>

</body>

</html>
