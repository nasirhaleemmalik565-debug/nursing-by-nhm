
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily MCQs</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f3ff;
margin:0;
}

header{
background:#6A1B9A;
color:white;
padding:18px;
display:flex;
align-items:center;
}

header a{
color:white;
text-decoration:none;
font-size:24px;
}

header h2{
margin:0 auto;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:18px;
box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.question{
font-size:22px;
font-weight:bold;
margin-bottom:20px;
line-height:1.5;
}

.option{
padding:15px;
margin:12px 0;
background:#f3f3f3;
border-radius:12px;
border:2px solid transparent;
cursor:pointer;
transition:.3s;
}

.option:hover{
background:#ececec;
}

.selected{
background:#E9D5FF;
border:2px solid #6A1B9A;
color:#4A148C;
font-weight:bold;
}
.correct{
background:#d4edda;
border-color:#28a745;
color:#155724;
font-weight:bold;
}

.wrong{
background:#f8d7da;
border-color:#dc3545;
color:#721c24;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#6A1B9A;
color:white;
border:none;
border-radius:12px;
font-size:18px;
}

#result{
margin-top:20px;
font-size:18px;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<header>

<a href="index.html">←</a>

<h2>Daily MCQs</h2>

</header>

<div class="card">

<div class="question">

Which vitamin deficiency causes Night Blindness?

</div>

<div class="option" data-correct="true">
A. Vitamin A
</div>

<div class="option">
B. Vitamin C
</div>

<div class="option">
C. Vitamin D
</div>

<div class="option">
D. Vitamin K
</div>

<button onclick="checkAnswer()">

Submit Answer

</button>

<p id="result"></p>
<script>

let selected=null;

let options=document.querySelectorAll(".option");

options.forEach(function(option){

option.onclick=function(){

options.forEach(function(o){

o.style.background="#f3f3f3";
o.classList.remove("selected");
o.classList.remove("correct");
o.classList.remove("wrong");

});

selected=this;

this.classList.add("selected");

};

});

function checkAnswer(){

if(selected==null){

alert("Please select an answer.");

return;

}

if(selected.dataset.correct=="true"){

selected.classList.add("correct");

document.getElementById("result").innerHTML="✅ Correct!";

document.getElementById("result").style.color="green";

}else{

selected.classList.add("wrong");

document.querySelector("[data-correct='true']").classList.add("correct");

document.getElementById("result").innerHTML="❌ Incorrect!";

document.getElementById("result").style.color="red";

}

}

</script>

</div>

</body>

</html>
