<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMI Calculator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="appbar">

<a href="tools.html" class="back-btn">←</a>

<div class="appbar-title">
BMI Calculator
</div>

</div>

<div class="container">

<div class="section-title">
BODY MASS INDEX
</div>

<div class="pearl-card">

<label><b>Weight (kg)</b></label>

<input type="number"
id="weight"
placeholder="Enter weight">

<br><br>

<label><b>Height (cm)</b></label>

<input type="number"
id="height"
placeholder="Enter height">

<br><br>

<button onclick="calculateBMI()"
class="btn">

Calculate BMI

</button>

</div>

<div class="pearl-card">

<h3>📊 BMI Result</h3>

<div id="bmiResult"
style="font-size:18px;
line-height:1.8;
text-align:center;
padding:10px;">

Enter your details above.

</div>

</div>
<div class="footer-space"></div>

</div>

<script>

function calculateBMI(){

let weight =
parseFloat(document.getElementById("weight").value);

let height =
parseFloat(document.getElementById("height").value);

if(!weight || !height){

document.getElementById("bmiResult").innerHTML =

"<div style='font-size:32px;font-weight:bold;color:"+color+";'>"

+ bmi.toFixed(1) +

"</div>" +

"<div style='font-size:20px;font-weight:bold;color:"+color+";'>"

+ emoji + " " + category +

"</div>" +

"<br>" +

"<div style='font-size:14px;color:#666;'>"

+"Healthy BMI Range<br><b>18.5 – 24.9 kg/m²</b>"

+"</div>";

return;

}

height = height/100;

let category = "";
let color = "";
let emoji = "";

if (bmi < 18.5){

category = "Underweight";
color = "#2196F3";
emoji = "🔵";

}

else if (bmi < 25){

category = "Normal Weight";
color = "#4CAF50";
emoji = "🟢";

}

else if (bmi < 30){

category = "Overweight";
color = "#FF9800";
emoji = "🟠";

}

else{

category = "Obese";
color = "#F44336";
emoji = "🔴";

}

document.getElementById("bmiResult").innerHTML =

"<b>BMI :</b> " + bmi.toFixed(1) +

"<br><br><b>Category :</b> <span style='color:" + color + ";font-weight:bold;'>" +

emoji + " " + category +

"</span>" +

"<br><br><small>Healthy BMI Range : 18.5 – 24.9 kg/m²</small>";

</script>

</body>

</html>
