<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMI Calculator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="appbar">

<a href="tools.html" class="back-btn">←</a>

<div class="appbar-title">
BMI Calculator
</div>

</div>

<div class="container">

<div class="section-title">
BODY MASS INDEX
</div>

<div class="pearl-card">

<label><b>Weight (kg)</b></label>

<input
type="number"
id="weight"
placeholder="Enter weight">

<br><br>

<label><b>Height (cm)</b></label>

<input
type="number"
id="height"
placeholder="Enter height">

<br><br>

<button
class="btn"
onclick="calculateBMI()">

Calculate BMI

</button>

</div>

<div class="pearl-card">

<h3>📊 BMI Result</h3>

<div
id="bmiResult"
style="text-align:center;padding:10px;font-size:18px;">

Enter your details above.

</div>

</div>

<div class="footer-space"></div>

</div>

<script>

function calculateBMI(){

let weight =
parseFloat(document.getElementById("weight").value);

let height =
parseFloat(document.getElementById("height").value);

if(isNaN(weight) || isNaN(height) || weight<=0 || height<=0){

document.getElementById("bmiResult").innerHTML =
"Please enter valid weight and height.";

return;

}

height = height/100;

let bmi =
weight/(height*height);

let category="";
let color="";
let emoji="";

if(bmi<18.5){

category="Underweight";
color="#2196F3";
emoji="🔵";

}

else if(bmi<25){

category="Normal Weight";
color="#4CAF50";
emoji="🟢";

}

else if(bmi<30){

category="Overweight";
color="#FF9800";
emoji="🟠";

}

else{

category="Obese";
color="#F44336";
emoji="🔴";

}

let advice = "";

if(bmi < 18.5){

advice = "Increase nutritious food intake and maintain a balanced diet.";

}

else if(bmi < 25){

advice = "Great! Maintain your healthy lifestyle.";

}

else if(bmi < 30){

advice = "Regular exercise and a balanced diet are recommended.";

}

else{

advice = "Consult a healthcare professional for weight management.";

}

document.getElementById("bmiResult").innerHTML =

"<div style='font-size:52px;font-weight:bold;color:"+color+";'>"

+bmi.toFixed(1)+

"</div>"

+

"<div style='font-size:28px;font-weight:bold;color:"+color+";'>"

+emoji+" "+category+

"</div>"

+

"<br>"

+

"<div style='font-size:17px;color:#666;'>"

+"❤️ Healthy BMI Range"

+"<br><b>18.5 – 24.9 kg/m²</b>"

+"</div>"

+

"<br>"

+

"<div style='background:#F7F7F7;padding:12px;border-radius:12px;'>"

+"<b>💡 Advice</b><br>"+advice+

"</div>";
}

</script>

</body>

</html>
